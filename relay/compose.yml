services:
  wechat-relay:
    build: .
    image: wechat-relay:latest
    container_name: wechat-relay
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      RELAY_PORT: "80"
      TLS_PORT: "443"
      TLS_CERT_PATH: "/app/certs/origin.pem"
      TLS_KEY_PATH: "/app/certs/origin-key.pem"
    volumes:
      - ./certs:/app/certs:ro
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
